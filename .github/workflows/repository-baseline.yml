name: repository-baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only a newer run for the same pull request supersedes work. Main, release and
# manually dispatched evidence is never cancelled by an unrelated ref/run.
concurrency:
  group: repository-baseline-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: CI partition preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -B -m unittest discover -s scripts -p 'test_ci_race.py'

  acceptance:
    name: SF acceptance
    if: ${{ always() }}
    needs: [preflight, baseline, store-race, runtime-integration, balanced]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BASELINE_RESULT: ${{ needs.baseline.result }}
          STORE_RACE_RESULT: ${{ needs.store-race.result }}
          RUNTIME_INTEGRATION_RESULT: ${{ needs.runtime-integration.result }}
          BALANCED_RESULT: ${{ needs.balanced.result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$BASELINE_RESULT" = success
          test "$STORE_RACE_RESULT" = success
          test "$RUNTIME_INTEGRATION_RESULT" = success
          test "$BALANCED_RESULT" = success

  baseline:
    # v1's production execution and compiled acceptance boundary is macOS.
    runs-on: macos-14
    needs: preflight
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [test-integration-other, crash-other, test-security, test-upgrade, test-compiled-e2e, verify-static]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Expose the setup toolchain at the approved repository-test path
        run: |
          set -eu
          setup_go=$(command -v go)
          sudo mkdir -p /usr/local/go/bin
          sudo ln -sfn "$setup_go" /usr/local/go/bin/go
          test "$(readlink /usr/local/go/bin/go)" = "$setup_go"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/artifact-check --base origin/main
      - name: Expose the approved Node runtime for compiled acceptance
        if: matrix.target == 'test-compiled-e2e'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -eu
          # The supported Homebrew layout splits the authenticated Mach-O
          # closure into bounded files. setup-node's 112MB monolithic binary
          # exceeds the production 64MiB file cap; never relax that cap for CI.
          brew list --versions node@22 >/dev/null 2>&1 || brew install node@22
          setup_node="$(brew --prefix node@22)/bin/node"
          "$setup_node" -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 22 || minor < 8) process.exit(1); console.log(process.version)'
          sudo mkdir -p /opt/homebrew/bin
          sudo ln -sfn "$setup_node" /opt/homebrew/bin/node
          test "$(readlink /opt/homebrew/bin/node)" = "$setup_node"
      - name: Run acceptance lane
        env:
          SF_CI_LANE: ${{ matrix.target }}
          SF_CI_ARTIFACT_DIR: .ci-timings
        run: make test-all
      - name: Preserve baseline lane outcome
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          LANE: ${{ matrix.target }}
        run: |
          mkdir -p .ci-timings
          printf '{"schema":1,"mode":"%s","outcome":"%s"}\n' "$LANE" "$JOB_STATUS" > .ci-timings/baseline-outcome.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-baseline-${{ matrix.target }}
          path: .ci-timings
          include-hidden-files: true
          if-no-files-found: warn

  store-race:
    # modernc SQLite migration fixtures under -race exceed one package's hour
    # on hosted macOS. Disjoint shards keep every test and each test's subtests.
    # Together with balanced race-other/runtime-race this is the full race suite.
    runs-on: macos-14
    needs: preflight
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Expose the setup toolchain at the approved repository-test path
        run: |
          set -eu
          setup_go=$(command -v go)
          sudo mkdir -p /usr/local/go/bin
          sudo ln -sfn "$setup_go" /usr/local/go/bin/go
          test "$(readlink /usr/local/go/bin/go)" = "$setup_go"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Store race shard
        env:
          SHARD: ${{ matrix.shard }}
          SF_CI_LANE: store-race
          SF_CI_ARTIFACT_DIR: .ci-timings
        run: make test-all
      - name: Preserve early failure or cancellation outcome
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .ci-timings
          printf '{"schema":1,"mode":"store","outcome":"%s"}\n' "$JOB_STATUS" > .ci-timings/store-${{ matrix.shard }}-outcome.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-store-race-${{ matrix.shard }}
          path: .ci-timings
          include-hidden-files: true
          if-no-files-found: warn

  balanced:
    # Measured bottlenecks in run 34416329428: runtime race 48m, other race
    # 45m, crash 26m. Partition live inventories; timing hints only balance work.
    runs-on: macos-14
    needs: preflight
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        lane: [race-other, runtime-race, crash-runtime]
        shard: [0, 1, 2, 3]
        include:
          - lane: race-other
            shard: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Expose the setup toolchain at the approved repository-test path
        run: |
          set -eu
          setup_go=$(command -v go)
          sudo mkdir -p /usr/local/go/bin
          sudo ln -sfn "$setup_go" /usr/local/go/bin/go
          test "$(readlink /usr/local/go/bin/go)" = "$setup_go"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run balanced acceptance shard
        env:
          SHARD: ${{ matrix.shard }}
          SF_CI_LANE: ${{ matrix.lane }}
          SF_CI_ARTIFACT_DIR: .ci-timings
        run: make test-all
      - name: Preserve early failure or cancellation outcome
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .ci-timings
          printf '{"schema":1,"mode":"%s","outcome":"%s"}\n' "${{ matrix.lane }}" "$JOB_STATUS" > .ci-timings/${{ matrix.lane }}-${{ matrix.shard }}-outcome.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-${{ matrix.lane }}-${{ matrix.shard }}
          path: .ci-timings
          include-hidden-files: true
          if-no-files-found: warn

  runtime-integration:
    # Complete normal integration inventory, including examples/fuzz seeds.
    # Every shard is required; no test-name hand-picked subset replaces it.
    runs-on: macos-14
    needs: preflight
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Expose the setup toolchain at the approved repository-test path
        run: |
          set -eu
          setup_go=$(command -v go)
          sudo mkdir -p /usr/local/go/bin
          sudo ln -sfn "$setup_go" /usr/local/go/bin/go
          test "$(readlink /usr/local/go/bin/go)" = "$setup_go"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run workflow runtime integration shard
        env:
          SHARD: ${{ matrix.shard }}
          SF_CI_LANE: runtime-integration
          SF_CI_ARTIFACT_DIR: .ci-timings
        run: make test-all
      - name: Preserve early failure or cancellation outcome
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .ci-timings
          printf '{"schema":1,"mode":"runtime-integration","outcome":"%s"}\n' "$JOB_STATUS" > .ci-timings/runtime-integration-${{ matrix.shard }}-outcome.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-runtime-integration-${{ matrix.shard }}
          path: .ci-timings
          include-hidden-files: true
          if-no-files-found: warn
